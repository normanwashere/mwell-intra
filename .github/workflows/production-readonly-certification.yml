name: Production Read-only Certification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unified-finance-module
    paths:
      - .github/workflows/production-readonly-certification.yml
      - apps/**
      - packages/**
      - scripts/qa/**
      - supabase/migrations/**

concurrency:
  group: production-readonly-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify live production identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      audit_date: ${{ steps.audit_identity.outputs.audit_date }}
      release_commit: ${{ steps.production_identity.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v5
      - name: Establish deterministic audit date
        id: audit_identity
        run: node scripts/qa/uat-ci-run-id.mjs --github-output "$GITHUB_OUTPUT"
      - name: Verify production health and deployment identity
        id: production_identity
        shell: bash
        run: |
          node <<'NODE' | tee -a "$GITHUB_OUTPUT"
          const response = await fetch("https://mwell-intra.vercel.app/api/health", {
            cache: "no-store",
          });
          if (!response.ok) throw new Error(`Production health returned HTTP ${response.status}.`);
          const health = await response.json();
          if (health.status !== "ok") throw new Error("Production health is not ok.");
          if (health.deployment?.appEnv !== "production") {
            throw new Error("Live deployment is not identified as production.");
          }
          if (health.deployment?.supabaseProjectRef !== "abbfziukjalyqtcuskhi") {
            throw new Error("Live deployment is not connected to the approved production Supabase project.");
          }
          if (health.supabase !== "reachable") throw new Error("Production Supabase is not reachable.");
          if (health.clientAuth !== "supabase-configured") {
            throw new Error("Production client authentication is not configured.");
          }
          if (health.features?.serviceWorker !== "configured") {
            throw new Error("Production service worker is not configured.");
          }
          if (!/^[a-f0-9]{40}$/.test(health.commit ?? "")) {
            throw new Error("Production did not report a full release commit.");
          }
          process.stdout.write(`release_commit=${health.commit}\n`);
          NODE

  routes:
    name: Live roles and UI (${{ matrix.viewport }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: uat
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - viewport: desktop-1440
            ordinal: 201
          - viewport: desktop-1280
            ordinal: 202
          - viewport: tablet-768
            ordinal: 203
          - viewport: mobile-390
            ordinal: 204
          - viewport: mobile-360
            ordinal: 205
          - viewport: mobile-320
            ordinal: 206
    env:
      APP_ENV: production
      AUDIT_BASE_URL: https://mwell-intra.vercel.app
      AUDIT_PHASE: routes
      AUDIT_VIEWPORT: ${{ matrix.viewport }}
      AUDIT_MUTATIONS: "false"
      AUDIT_OUTPUT_PATH: test-results/production-routes-${{ matrix.viewport }}.json
      NEXT_PUBLIC_SUPABASE_URL: https://abbfziukjalyqtcuskhi.supabase.co
      AUDIT_PASSWORD: ${{ secrets.AUDIT_PASSWORD || secrets.UAT_AUDIT_MASTER_PASSWORD }}
      SUPABASE_PROJECT_REF: abbfziukjalyqtcuskhi
      PRODUCTION_SUPABASE_PROJECT_REF: abbfziukjalyqtcuskhi
      POLICY_ALLOW_TEST_MUTATIONS: "false"
      AUDITED_RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @intra/shell exec playwright install --with-deps chromium
      - name: Audit every production persona, route, and visible control
        shell: bash
        run: |
          export AUDIT_RUN_ID="$(node scripts/qa/uat-ci-run-id.mjs \
            --date "${{ needs.prepare.outputs.audit_date }}" \
            --run-number "${{ github.run_number }}" \
            --ordinal "${{ matrix.ordinal }}")"
          pnpm test:intra-live
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-routes-${{ matrix.viewport }}-${{ github.run_number }}
          path: test-results/production-routes-${{ matrix.viewport }}.json
          if-no-files-found: error
          retention-days: 30
